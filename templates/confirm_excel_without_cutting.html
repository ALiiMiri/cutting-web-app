<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید خروجی Excel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f9; font-family: var(--font-family-base); color: #263238; }
        .page { min-height: calc(100vh - 72px); display: grid; place-items: center; padding: 28px; }
        .card { width: min(620px, 100%); background: #fff; border: 1px solid #e4e9ef; border-radius: 18px; padding: 30px; box-shadow: 0 14px 38px rgba(33, 43, 54, .10); }
        .icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; background: #fff4d6; color: #9a6700; font-size: 30px; margin-bottom: 18px; }
        h1 { margin: 0 0 10px; font-size: 22px; }
        .project { color: #607d8b; margin-bottom: 20px; }
        .warning { line-height: 2; background: #fff9e8; border-right: 4px solid #f0ad2c; border-radius: 10px; padding: 14px 16px; }
        .question { font-weight: 700; margin: 22px 0; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .button { text-decoration: none; border-radius: 10px; padding: 11px 18px; font-weight: 700; }
        .confirm { background: #218c5b; color: #fff; }
        .cancel { background: #edf1f5; color: #34495e; }
    </style>
</head>
<body class="with-app-header">
    {% include '_app_header.html' %}
    <main class="page">
        <section class="card">
            <div class="icon">!</div>
            <h1>خروجی Excel بدون نتایج برش</h1>
            <div class="project">سفارش: {{ project.customer_name or project.project_code }}</div>
            <div class="warning">{{ warning_message }}</div>
            <div class="question">آیا مطمئن هستید که می‌خواهید خروجی Excel را دریافت کنید؟</div>
            <div class="actions">
                <a class="button confirm" href="{{ url_for('export_to_excel', project_id=project.id, confirm_without_cutting=1) }}">بله، خروجی را دریافت کن</a>
                <a class="button cancel" href="{{ url_for('project_treeview', project_id=project.id) }}">خیر، بازگشت</a>
            </div>
        </section>
    </main>
</body>
</html>
